<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Coxinha - Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #8B0000;
            --secondary-color: #FFC107;
        }
        body { background-color: #FAFAFA; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 80px; }
        .bg-primary { background-color: var(--primary-color); }
        .text-primary { color: var(--primary-color); }
        .border-primary { border-color: var(--primary-color); }
        .qty-btn { background-color: #eee; color: #333; width: 30px; height: 30px; border-radius: 5px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .qty-btn:hover { background-color: #ddd; }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 50; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 15px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<header class="bg-primary text-white text-center py-6 shadow-md rounded-b-3xl mb-6">
    <div class="w-24 h-24 mx-auto rounded-full border-4 border-white mb-3 bg-white flex items-center justify-center overflow-hidden shadow">
        <span class="text-3xl">🥠</span>
    </div>
    <h1 class="text-3xl font-bold">Maria Coxinha</h1>
    <p class="text-yellow-400 font-semibold mt-1">O melhor sabor para você!</p>
</header>

<div class="max-w-2xl mx-auto px-4">
    
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-primary border-b-2 border-primary pb-2 mb-4">💧 Salgados Fritos (Porções)</h2>
        <div id="salgados-list" class="space-y-4"></div>
    </div>

    <div class="mb-8">
        <h2 class="text-2xl font-bold text-primary border-b-2 border-primary pb-2 mb-4">🥖 Churros</h2>
        <div id="churros-list" class="space-y-4"></div>
    </div>

    <div class="mb-8">
        <h2 class="text-2xl font-bold text-primary border-b-2 border-primary pb-2 mb-4">🥤 Bebidas</h2>
        <div id="bebidas-list" class="space-y-4"></div>
    </div>

    <div id="cart-container" class="bg-white p-6 rounded-xl shadow-lg mt-8 border-t-4 border-primary">
        <h2 class="text-2xl font-bold text-primary mb-4">🛒 Seu Pedido</h2>
        <ul id="cart-items" class="space-y-3 mb-4">
            <li class="text-gray-500 text-center py-4">O carrinho está vazio.</li>
        </ul>
        <div class="text-2xl font-bold text-right text-gray-800 border-t pt-4" id="cart-total">Total: R$ 0,00</div>

        <div class="mt-6 space-y-4">
            <!-- Dados do Cliente -->
            <div>
                <label class="block font-bold text-gray-700 mb-1">Seu Nome:</label>
                <input type="text" id="client-name" placeholder="Digite seu nome completo" class="w-full p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Seu Telefone (WhatsApp):</label>
                <input type="tel" id="client-phone" placeholder="(35) 99999-9999" class="w-full p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Tipo de Pedido:</label>
                <select id="order-type" onchange="toggleOrderFields()" class="w-full p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-primary">
                    <option value="Entrega em 45-55 minutos">Entrega em 45-55 minutos</option>
                    <option value="Retirada">Retirada na loja</option>
                    <option value="Agendar pedido">Agendar pedido</option>
                </select>
            </div>

            <div id="schedule-container" style="display: none;">
                <label class="block font-bold text-gray-700 mb-1">Data e Horário da Entrega/Retirada:</label>
                <input type="datetime-local" id="schedule-datetime" class="w-full p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div id="address-container">
                <label class="block font-bold text-gray-700 mb-1">Endereço de Entrega:</label>
                <input type="text" id="address" placeholder="Rua, Número, Bairro (Varginha/MG)" class="w-full p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Forma de Pagamento:</label>
                <select id="payment" class="w-full p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-primary">
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito (Link REDE)">Cartão de Crédito (Link REDE)</option>
                    <option value="Cartão (Maquininha na Entrega)">Cartão (Maquininha na Entrega)</option>
                    <option value="Dinheiro (Na Entrega)">Dinheiro (Na Entrega)</option>
                </select>
            </div>

            <button onclick="sendOrder()" id="btn-finalizar" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold text-lg py-4 rounded-lg shadow-md transition duration-300 mt-4 flex items-center justify-center gap-2">
                <span>Finalizar Pedido</span>
            </button>
        </div>
    </div>

</div>

<div id="toast">Mensagem de aviso</div>

<script>
    const salgados = [
        { id: 's1', name: '5 un. Coxinha de Frango c/ Requeijão', price: 4.50 },
        { id: 's2', name: '5 un. Coxinha de Frango c/ Calabresa', price: 4.50 },
        { id: 's3', name: '5 un. Cigarrete', price: 4.50 },
        { id: 's4', name: '5 un. Quibe', price: 4.50 },
        { id: 's5', name: '5 un. Bolinha de Queijo', price: 4.50 },
        { id: 's6', name: '5 un. Bolinha de Queijo c/ Bacon', price: 4.50 },
        { id: 's7', name: '5 un. Bolinha de Milho c/ Requeijão', price: 4.50 },
        { id: 's8', name: '5 un. Rissole de Carne', price: 4.50 }
    ];

    const churros = [ { id: 'c1', name: '5 un. Churros de Doce de Leite', price: 5.00 } ];

    const bebidas = [
        { id: 'b1', name: 'Água sem gás', price: 3.00 }, { id: 'b2', name: 'Água com gás', price: 3.50 },
        { id: 'b3', name: 'Coca caçulinha', price: 4.00 }, { id: 'b4', name: 'Coca zero caçulinha', price: 4.00 },
        { id: 'b5', name: 'Sodinha caçulinha', price: 4.00 }, { id: 'b6', name: 'Coca lata', price: 7.00 },
        { id: 'b7', name: 'Coca zero lata', price: 7.00 }, { id: 'b8', name: 'Coca 600mL', price: 9.50 },
        { id: 'b9', name: 'Coca zero 600mL', price: 9.50 }, { id: 'b10', name: 'Sodinha 600mL', price: 7.50 },
        { id: 'b11', name: 'Coca 2 litros', price: 16.00 }, { id: 'b12', name: 'Coca zero 2 litros', price: 16.00 },
        { id: 'b13', name: 'Sodinha 2 litros', price: 11.00 }, { id: 'b14', name: 'Del Valle Maracujá lata', price: 7.50 },
        { id: 'b15', name: 'Del Valle Uva lata', price: 7.50 }, { id: 'b16', name: 'Tampico 250mL', price: 4.50 },
        { id: 'b17', name: 'Tampico 450mL', price: 6.50 }
    ];

    let cart = {};

    function formatMoney(value) { return value.toFixed(2).replace('.', ','); }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show";
        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function toggleOrderFields() {
        const type = document.getElementById('order-type').value;
        const addressContainer = document.getElementById('address-container');
        const scheduleContainer = document.getElementById('schedule-container');

        if (type === 'Retirada') {
            addressContainer.style.display = 'none'; scheduleContainer.style.display = 'none';
        } else if (type === 'Agendar pedido') {
            addressContainer.style.display = 'block'; scheduleContainer.style.display = 'block';
        } else {
            addressContainer.style.display = 'block'; scheduleContainer.style.display = 'none';
        }
    }

    function changeQty(id, name, price, delta) {
        if (!cart[id]) { if (delta > 0) cart[id] = { name, price, qty: 1 }; } 
        else {
            cart[id].qty += delta;
            if (cart[id].qty <= 0) delete cart[id];
        }
        updateItemUI(id); updateCartUI();
    }

    function updateItemUI(id) {
        const qtySpan = document.getElementById(`qty-${id}`);
        if (qtySpan) qtySpan.innerText = cart[id] ? cart[id].qty : 0;
    }

    function updateCartUI() {
        const cartItems = document.getElementById('cart-items');
        let total = 0; cartItems.innerHTML = '';
        const keys = Object.keys(cart);
        
        if (keys.length === 0) {
            cartItems.innerHTML = '<li class="text-gray-500 text-center py-4">O carrinho está vazio.</li>';
        } else {
            keys.forEach(id => {
                const item = cart[id]; const subtotal = item.price * item.qty; total += subtotal;
                cartItems.innerHTML += `
                    <li class="flex justify-between items-center border-b pb-2">
                        <span class="font-semibold text-gray-700">${item.qty}x ${item.name}</span>
                        <span class="font-bold">R$ ${formatMoney(subtotal)}</span>
                    </li>`;
            });
        }
        document.getElementById('cart-total').innerText = `Total: R$ ${formatMoney(total)}`;
    }

    function renderList(list, containerId) {
        const container = document.getElementById(containerId);
        list.forEach(item => {
            container.innerHTML += `
                <div class="flex items-center justify-between bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-gray-100 rounded-md flex items-center justify-center text-xl border">
                            🍽️
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm sm:text-base">${item.name}</h3>
                            <p class="text-primary font-bold">R$ ${formatMoney(item.price)}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 bg-gray-50 p-1 rounded-lg border">
                        <button onclick="changeQty('${item.id}', '${item.name}', ${item.price}, -1)" class="qty-btn">-</button>
                        <span id="qty-${item.id}" class="w-6 text-center font-bold text-gray-700">0</span>
                        <button onclick="changeQty('${item.id}', '${item.name}', ${item.price}, 1)" class="qty-btn">+</button>
                    </div>
                </div>
            `;
        });
    }

    renderList(salgados, 'salgados-list'); 
    renderList(churros, 'churros-list'); 
    renderList(bebidas, 'bebidas-list');

    function sendOrder() {
        const seuLinkDaRede = "https://www.userede.com.br/seu-link-aqui"; 
        const chavePix = "35991711875";
        const bancoPix = "Pagbank";
        const tipoChave = "Celular";
        const nomeEmpresa = "Augusto Ferreira Alimentos / Maria Coxinha";
        const phone = "5535988712303"; 

        const clientName = document.getElementById('client-name').value.trim();
        const clientPhone = document.getElementById('client-phone').value.trim();
        const orderType = document.getElementById('order-type').value;
        const address = document.getElementById('address').value.trim();
        const payment = document.getElementById('payment').value;
        const scheduleDateTime = document.getElementById('schedule-datetime').value;

        if (!clientName) {
            showToast('Por favor, informe seu nome.');
            document.getElementById('client-name').focus(); return;
        }

        if (!clientPhone) {
            showToast('Por favor, informe seu telefone.');
            document.getElementById('client-phone').focus(); return;
        }

        const keys = Object.keys(cart);
        if (keys.length === 0) { showToast('Adicione pelo menos um item ao carrinho!'); return; }

        if (orderType !== 'Retirada' && !address) {
            showToast('Por favor, informe o endereço de entrega.');
            document.getElementById('address').focus(); return;
        }

        if (orderType === 'Agendar pedido' && !scheduleDateTime) {
            showToast('Por favor, informe a data e horário desejados.');
            document.getElementById('schedule-datetime').focus(); return;
        }

        let total = 0;
        let message = `*NOVO PEDIDO - MARIA COXINHA* %0A%0A`;
        message += `👤 *Cliente:* ${clientName}%0A`;
        message += `📞 *Telefone:* ${clientPhone}%0A`;
        message += `📦 *Tipo:* ${orderType}%0A`;
        
        if(orderType === 'Agendar pedido') {
            const dateObj = new Date(scheduleDateTime);
            message += `📅 *Para:* ${dateObj.toLocaleDateString('pt-BR')} às ${dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}%0A`;
        }

        message += `%0A*Itens do Pedido:*%0A`;
        keys.forEach(id => {
            const item = cart[id]; 
            const subtotal = item.price * item.qty; 
            total += subtotal;
            message += `- ${item.qty}x ${item.name} (R$ ${formatMoney(subtotal)})%0A`;
        });

        message += `%0A*Total:* R$ ${formatMoney(total)}%0A`;
        if (orderType !== 'Retirada') message += `📍 *Endereço:* ${address}%0A`;
        message += `💳 *Pagamento:* ${payment}%0A`;

        const whatsappUrl = `https://wa.me/${phone}?text=${message}`;
        const cartContainer = document.getElementById('cart-container');
        let paymentHTML = '';

        if (payment === 'Cartão de Crédito (Link REDE)') {
            paymentHTML = `
                <div class="bg-orange-50 border-2 border-orange-400 p-5 rounded-lg mb-6 shadow-sm">
                    <p class="font-bold text-orange-800 text-lg mb-2">💳 Pague agora via REDE</p>
                    <p class="text-sm text-gray-600 mb-4">Clique no botão abaixo para pagar com segurança utilizando seu cartão de crédito.</p>
                    <a href="${seuLinkDaRede}" target="_blank" class="block w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-lg shadow-md text-center">Ir para o Pagamento</a>
                </div>
            `;
        } else if (payment === 'Pix') {
            paymentHTML = `
                <div class="bg-blue-50 border-2 border-blue-400 p-5 rounded-lg mb-6 shadow-sm text-center">
                    <p class="font-bold text-blue-800 text-lg mb-2">💠 Pagamento via Pix</p>
                    <p class="text-sm text-gray-700 mb-2">Copie a chave abaixo e faça o pagamento:</p>
                    <div class="bg-white p-3 border rounded font-mono font-bold text-xl select-all mb-4 cursor-pointer shadow-inner text-blue-900">${chavePix}</div>
                    <div class="bg-blue-100 rounded p-3 text-sm text-blue-800 inline-block text-left w-full sm:w-auto shadow-sm mb-4">
                        <p class="mb-1">🏢 Favorecido: <span class="font-bold block text-base">${nomeEmpresa}</span></p>
                        <p class="mb-1">🏦 Banco: <span class="font-bold">${bancoPix}</span></p>
                        <p>📱 Tipo de Chave: <span class="font-bold">${tipoChave}</span></p>
                    </div>
                    <!-- Lembrete do Comprovante -->
                    <div class="bg-red-100 border-2 border-red-500 text-red-800 p-3 rounded-lg font-bold text-sm shadow-sm">
                        ⚠️ ATENÇÃO: Não se esqueça de enviar o comprovante do Pix aqui no WhatsApp após concluir o pagamento!
                    </div>
                </div>
            `;
        } else {
            paymentHTML = `<div class="bg-gray-100 p-4 rounded-lg mb-6"><p class="text-gray-700 font-bold">Você escolheu pagar na entrega.</p></div>`;
        }

        cartContainer.innerHTML = `
            <div class="text-center py-6 animate-fade-in">
                <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-4 shadow-sm">✅</div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Pedido Registrado, ${clientName}!</h2>
                <p class="text-gray-600 mb-8">Clique no botão abaixo para enviar os detalhes do seu pedido para o nosso atendimento.</p>
                
                ${paymentHTML}
                
                <a href="${whatsappUrl}" target="_blank" class="block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-lg shadow-md text-center flex items-center justify-center gap-2">
                    📱 Enviar Pedido no WhatsApp
                </a>
            </div>
        `;

        window.scrollTo({ top: cartContainer.offsetTop - 20, behavior: 'smooth' });
    }
</script>

</body>
</html>
